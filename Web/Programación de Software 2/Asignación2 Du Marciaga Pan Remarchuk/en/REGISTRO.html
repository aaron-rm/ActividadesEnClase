<!DOCTYPE html>
<html style="background-color: #D9FFEA; font-family: Verdana, Geneva, Tahoma, sans-serif;" lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Salud Vital</title>
        <link rel="icon" href="../logo.png"> <!--pone el ícono de la página-->
    </head>

    <!-- NOTA filter: blur(5px) brightness(150%)  se puede usar en style para difuminar la imagen-->
    <body style="margin: 0; color: #000000; background-image: url(../vegetales.png);">

        <!--margin:0 quita el margen automatico de las páginas, color: #000000 pone la fuente en color negro de forma predeterminada-->
        <header style="background-color: #2d6a4f; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #ffffff; text-align: center;">
            <h1 style="padding: 40px; margin: 0;">Salud Vital</h1> <!--padding agrega separación entre el bloque y el texto-->
        </header>

        <nav style="display: flex; justify-content: center; background-color: #1b4332;">
            <!--display:flex nos permite aplicar atributos de bloque y línea-->
            <!--justify-content, se usa con display:flex, para centrar los elementos del display-->
            <ul style="list-style: none; padding: 10px 20px; margin: 0;">
                                        <!--padding 10(arriba y abajo) 20(izquierda y derecha)-->
                <li style="display: inline; margin: 0 10px"> <!--diplay: inline, los coloca en la misma línea-->
                                    <!--margin 0(arriba y abajo) y 10(izquierda y derecha) para separar un poco-->
                    <a href="HOME.html" style="text-decoration: none; color: #ffffff; font-weight: bold">Home</a>
                </li>                      <!--text-decoration: none quita el subrayado-->
                <li style="display: inline; margin: 0 10px">
                    <a href="BLOG.html" style="text-decoration: none; color: #ffffff; font-weight: bold">Blog</a>
                </li>
                <li style="display: inline; margin: 0 10px">
                    <a href="REGISTRO.html" style="text-decoration: none; color: #ffffff; font-weight: bold;">Sign Up</a>
                </li>
                <li style="display: inline; margin: 0 10px">
                    <a href="CONTACTO.html" style="text-decoration: none; color: #ffffff; font-weight: bold">Contact Us</a>
                </li>
            </ul>
        </nav>

        <br><br>

        
        <section>
            <!-- Usar margin para dar espacio permite ver la imagen de fondo, en lugar de padding-->
            <!-- 
            Para poder detectar el cambio en la barra o slider y transformarlo se usa el oninput.
            El oninput, seria en cambio de la entrada realiza lo siguiente: que es asignar una salida
            el valor que tiene en el slider o control deslizante.
             -->
            <form style="margin: 0% 20% 0% 20% ; background-color:#FFFFFF; border: 3px solid; border-color: #f88d00; border-radius: 8px" oninput="valorAgua.value=parseFloat(agua_range.value)">
            <fieldset name="formulario" style="padding: 0px 30px 30px 30px; border-radius: 8px">
                
                <h2 style="text-align:center; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #1a7945;">Form</h2>

                <div style="font-family: Verdana, Geneva, Tahoma, sans-serif;">    
                    <label>Full name</label> <input type="text" placeholder="Juan Perez"> <br>
                    <label>Birthdate</label> <input type="date"><br>
                    <label>Email</label> <input type="email" placeholder="email@example.com"> <br>
                    <label>Telephone number</label> <input type="tel" placeholder="5555-5555" pattern="[0-9]{4}-[0-9]{4}|[0-9]{8-7}|[0-9]{4}-[0-9]{4}|[0-9]{3}-[0-9]{4}"> <br>
    
                    <br>
    
                    <label>Gender:</label> <br>
                    <input type="radio" id="masculino" name="sexo" value="Masculino">
                    <label for="masculino">Male</label><br>
                    <input type="radio" id="femenino" name="sexo" value="Masculino">
                    <label for="femenino">Female</label><br>
                    <input type="radio" id="otro" name="sexo" value="Masculino">
                    <label for="otro">Other</label><br>
    
                    <br>
    
                    <label>Address</label> <input type="text" size="50" placeholder="Ciudad de Panamá, Calle 50, Edicicio, apartamento"> <br>
                    <label>Weight</label> <input type="text" placeholder="60" size="5"> <label>kilograms</label> <br>
                    <label>Height</label> <input type="text" placeholder="170" size="5"> <label>centimeters</label> <br>
                    
                    <br>
    
                    <label>Physical Activity Level</label>
                    <select name="actividad_fisica" id="menu1">
                        <option value="sedentario">Sedentary</option> 
                        <option value="ligero">Light</option>
                        <option value="moderado">Moderate</option>
                        <option value="inteso">Intense</option>
                    </select>
    
                    <br><br>
    
                    <label>Nutritional goal</label> <br>
                    <input type="checkbox" id="perder_peso" name="perder_peso" value="Perder peso">
                    <label for="perder_peso">Lose weight</label><br>
                    <input type="checkbox" id="masa_muscular" name="masa_muscular" value="Ganar masa muscular">
                    <label for="masa_muscular">Gain muscle mass</label><br>
                    <input type="checkbox" id="mejorar_salud" name="mejorar_salud" value="Mejorar la salud">
                    <label for="mejorar_salud">Improve health</label><br>
    
                    <br>
    
                    <label>Allergies or dietary restrictions</label> <br>
                    <textarea cols="60" rows="5" placeholder="Allergies such as to shellfish, milk, eggs, nuts, among others, or dietary restrictions such as vegetarianism..."></textarea>
    
                    <br><br>
    
                    <label>Daily amount of water consumed</label> <input type="range" id="agua_range" name="agua_range" min="0" max="20" value="2" step="0.01" style="width:100%; max-width: 50%;">
                    <output name="valorAgua" id="valorAgua">2</output> Liters <br>
    
                    <br>
    
                    <label>Food photo</label>
                    <input type="file">
    
                    <br><br>
    
                    <label>Usual time for main meal</label>
                    <input type="time">
                </div>

            </fieldset>

            </form>

        </section>

        <br><br>

        <footer style="background-color: #343a40; color: #ffffff; padding: 30px; text-align: center;">
            <div style="font-weight: bold;">
                <a href="https://www.tiendanube.com/blog/faq/" target="_blank" style="color: #ffffff; text-decoration: none;">Frequently Asked Questions</a> |
                <a href="https://www.wonder.legal/mx/modele/aviso-privacidad?msockid=0f2ea327c6bc602a1e06b41ec7c26136" target="_blank" style="color: #ffffff; text-decoration: none;">Privacy</a> | <!-- target="_blank" abre el enlace en una página nueva-->
                <a href="https://consortiumlegal.com/2025/09/02/registro-de-terminos-de-uso-comun-genericos-y-o-descriptivos-en-latinoamerica/" target="_blank" style="color: #ffffff; text-decoration: none;">Terms of Use</a>
            </div>
            <div>
                <br>
                <label for="lang">Language:</label>
                <select id="lang" onchange="window.location.href=this.value;"><!--onchange, permite realizar "algo" al detectar un cambio-->
                    <option value="../REGISTRO.html">Spanish</option>
                    <option value="REGISTRO.html" selected>English</option>
                </select>
            </div>
            <br>
            <div style="color: #D9FFEA;">
                    <span style="font-weight: bold;">Group formed by:</span><br>
                    Yongsheng Du <br> Kevin Marciaga <br> Kevin Pan <br> Aaron Remarchuk <br>
            </div>
        </footer>

    </body>
</html>
